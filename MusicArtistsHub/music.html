
<!DOCTYPE html>

    <title>Mzansi Music</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>

        <h1>🇿🇦 Mzansi Music</h1>

        <p>
            Discover South African Amapiano and Maskandi Artists
        </p>

    </header>


    <main>

      

        <section>

            <h2>Choose Your Music Genre</h2>

            <button onclick="showArtists('amapiano')">
                Amapiano
            </button>

            <button onclick="showArtists('maskandi')">
                Maskandi
            </button>

        </section>


        

        <section id="artistSection" hidden>

            <h2>Choose an Artist</h2>

            <div id="artists"></div>

        </section>


        

        <section id="songSection" hidden>

            <h2 id="artistName">
                Songs
            </h2>

            <div id="songs"></div>

            <br>

            <audio id="musicPlayer" controls>
                Your browser does not support the audio player.
            </audio>

        </section>

        <p>Press the button below to logout.</p>

        <button type="submit" onclick="logout()">Logout</button>

    </main>

};


function showArtists(genre) {

    const artistSection =
        document.getElementById("artistSection");

    const artists =
        document.getElementById("artists");

    const songSection =
        document.getElementById("songSection");


    artists.innerHTML = "";

    songSection.hidden = true;

    artistSection.hidden = false;


    const artistList = music[genre];


    for (let artist in artistList) {

        const artistButton =
            document.createElement("button");

        artistButton.innerHTML = artist;


        artistButton.onclick = function () {

            showSongs(
                artist,
                artistList[artist]
            );

        };


        artists.appendChild(artistButton);

    }
}


function showSongs(artist, songs) {

    const songSection =
        document.getElementById("songSection");

    const artistName =
        document.getElementById("artistName");

    const songList =
        document.getElementById("songs");


    artistName.innerHTML =
        artist + " - Songs";

    songList.innerHTML = "";


    songs.forEach(function (song) {

        const songButton =
            document.createElement("button");


        songButton.innerHTML =
            "▶ " + song.name;


        songButton.onclick = function () {

            playSong(song);

        };


        songList.appendChild(songButton);

    });


    songSection.hidden = false;
}


function playSong(song) {

    const player =
        document.getElementById("musicPlayer");


    player.src = song.file;

    player.play();

}

    </script>
